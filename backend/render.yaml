services:
  - type: web
    name: Data2API-backend
    runtime: python
    pythonVersion: 3.12.3  
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000 --limit-max-request 100000000
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
